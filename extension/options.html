<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bookmarker settings</title>
    <style>
      body {
        max-width: 460px;
        margin: 40px auto;
        padding: 0 16px;
        font:
          14px/1.5 -apple-system,
          "Inter",
          system-ui,
          sans-serif;
        color-scheme: light dark;
      }
      input {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid #c9ccd8;
        border-radius: 8px;
        font: inherit;
        background: transparent;
        color: inherit;
      }
      button {
        margin-top: 12px;
        padding: 9px 16px;
        border: 0;
        border-radius: 8px;
        background: #5b5bd6;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      p {
        color: #6b7080;
      }
    </style>
  </head>
  <body>
    <h1>Bookmarker</h1>
    <label for="app">Your Bookmarker address</label>
    <input
      id="app"
      type="url"
      placeholder="https://your-bookmarker.example.com"
    />
    <p>
      Use the same address you open the app at. The browser will ask permission
      to talk to it.
    </p>
    <label for="token">Capture token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" />
    <p>
      In Bookmarker open Settings, then Connect, and copy the token from the
      email-to-save address (the part after <code>token=</code>).
    </p>
    <button id="save">Save</button>
    <span id="status"></span>
    <script src="options.js"></script>
  </body>
</html>
