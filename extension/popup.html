<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #1c1d2b;
        --muted: #6b7080;
        --line: #e3e5ec;
        --brand: #5b5bd6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14151f;
          --fg: #f1f2f7;
          --muted: #9a9fb3;
          --line: #2a2c3d;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 340px;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.4 -apple-system,
          "Inter",
          system-ui,
          sans-serif;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
        letter-spacing: -0.01em;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      input,
      select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      input:focus,
      select:focus {
        outline: 2px solid var(--brand);
        outline-offset: -1px;
      }
      button {
        width: 100%;
        margin-top: 14px;
        padding: 9px;
        border: 0;
        border-radius: 8px;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .note {
        margin-top: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        background: color-mix(in oklab, var(--brand) 10%, transparent);
      }
      .warn {
        background: color-mix(in oklab, #f59e0b 16%, transparent);
      }
      .muted {
        color: var(--muted);
      }
      a {
        color: var(--brand);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>Save to Bookmarker</h1>
    <p id="message" class="muted">Loading…</p>
    <form id="form" hidden>
      <label for="title">Title</label>
      <input id="title" maxlength="500" />
      <label for="folder">Folder</label>
      <select id="folder"></select>
      <label for="tags">Tags</label>
      <input
        id="tags"
        list="known-tags"
        placeholder="comma separated, e.g. dev/rust, read-later"
      />
      <datalist id="known-tags"></datalist>
      <p id="duplicate" class="note warn" hidden></p>
      <button id="save" type="submit">Save</button>
    </form>
    <script src="popup.js"></script>
  </body>
</html>
