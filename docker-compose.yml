services:
  mongodb:
    image: mongo:7
    container_name: bookmarker_mongodb
    restart: unless-stopped
    # Bound to localhost only: this instance has no authentication.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
