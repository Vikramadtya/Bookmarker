<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Bookmarker | Your Personal Bookmark Manager</title>
    <meta name="title" content="Bookmarker | Your Personal Bookmark Manager" />
    <meta
      name="description"
      content="A fast, minimal, and modern self-hosted bookmark manager to organize your links."
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#020617"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://bookmarker-theta-three.vercel.app/"
    />
    <meta
      property="og:title"
      content="Bookmarker | Your Personal Bookmark Manager"
    />
    <meta
      property="og:description"
      content="A fast, minimal, and modern self-hosted bookmark manager to organize your links."
    />
    <meta
      property="og:image"
      content="https://bookmarker-theta-three.vercel.app/logo/logo.svg"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://bookmarker-theta-three.vercel.app/"
    />
    <meta
      property="twitter:title"
      content="Bookmarker | Your Personal Bookmark Manager"
    />
    <meta
      property="twitter:description"
      content="A fast, minimal, and modern self-hosted bookmark manager to organize your links."
    />
    <meta
      property="twitter:image"
      content="https://bookmarker-theta-three.vercel.app/logo/logo.svg"
    />

    <!-- Favicon Links -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="/favicon/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
