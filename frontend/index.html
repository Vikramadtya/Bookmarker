<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Bookmarker | Your Personal Bookmark Manager</title>
    <meta name="title" content="Bookmarker | Your Personal Bookmark Manager" />
    <meta
      name="description"
      content="A fast, minimal, and modern self-hosted bookmark manager to organize your links."
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#020617"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://bookmarker-theta-three.vercel.app/"
    />
    <meta
      property="og:title"
      content="Bookmarker | Your Personal Bookmark Manager"
    />
    <meta
      property="og:description"
      content="A fast, minimal, and modern self-hosted bookmark manager to organize your links."
    />
    <meta
      property="og:image"
      content="https://bookmarker-theta-three.vercel.app/logo/logo.svg"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://bookmarker-theta-three.vercel.app/"
    />
    <meta
      property="twitter:title"
      content="Bookmarker | Your Personal Bookmark Manager"
    />
    <meta
      property="twitter:description"
      content="A fast, minimal, and modern self-hosted bookmark manager to organize your links."
    />
    <meta
      property="twitter:image"
      content="https://bookmarker-theta-three.vercel.app/logo/logo.svg"
    />

    <!-- Favicon Links -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <style>
      /* Loading animation: shared by this pre-load splash and the BookmarkLoader component. */
      .bm-splash {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
      }
      @media (prefers-color-scheme: dark) {
        .bm-splash {
          background: #020617;
        }
      }
      .bm-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        color: #5b5bd6;
      }
      .bm-loader svg {
        overflow: visible;
        animation: bm-bob 1.8s ease-in-out infinite;
      }
      .bm-ribbon {
        fill: currentColor;
        fill-opacity: 0;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linejoin: round;
        stroke-linecap: round;
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
        animation: bm-draw 1.8s ease-in-out infinite;
      }
      .bm-shadow {
        width: 22px;
        height: 4px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.18;
        animation: bm-shadow 1.8s ease-in-out infinite;
      }
      .bm-label {
        font:
          500 13px/1 -apple-system,
          system-ui,
          sans-serif;
        color: #64748b;
      }
      @keyframes bm-draw {
        0% {
          stroke-dashoffset: 60;
          fill-opacity: 0;
        }
        50% {
          stroke-dashoffset: 0;
          fill-opacity: 0;
        }
        68%,
        88% {
          stroke-dashoffset: 0;
          fill-opacity: 1;
        }
        100% {
          stroke-dashoffset: 0;
          fill-opacity: 0;
        }
      }
      @keyframes bm-bob {
        0%,
        100% {
          transform: translateY(0);
        }
        68% {
          transform: translateY(-5px);
        }
        80% {
          transform: translateY(0);
        }
      }
      @keyframes bm-shadow {
        0%,
        100% {
          transform: scaleX(1);
        }
        68% {
          transform: scaleX(0.7);
        }
        80% {
          transform: scaleX(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bm-ribbon,
        .bm-loader svg,
        .bm-shadow {
          animation: none;
        }
        .bm-ribbon {
          stroke-dashoffset: 0;
          fill-opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app code has loaded; React replaces it. -->
      <div class="bm-splash" role="status" aria-label="Loading Bookmarker">
        <div class="bm-loader">
          <svg width="40" height="52" viewBox="0 0 24 24" aria-hidden="true">
            <path
              class="bm-ribbon"
              pathLength="60"
              d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"
            />
          </svg>
          <div class="bm-shadow"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
